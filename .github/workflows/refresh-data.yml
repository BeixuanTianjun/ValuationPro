name: Refresh data IDX & kirim alert

# Vercel serves static files and cannot run a scheduler, shell out to curl, or
# write to disk. This workflow does that work instead: it refreshes the bundled
# market data, commits it back, and sends the stock-pick digest. Pushing the
# updated data triggers a Vercel redeploy, so the deployed terminal follows.
#
# All cron times are UTC. WIB is UTC+7.
#   05:07 UTC = 12:07 WIB  Sesi I closes   -> refresh + alert
#   09:17 UTC = 16:17 WIB  CLOSING CAPTURE -> refresh + alert
#   09:47 UTC = 16:47 WIB  CLOSING RETRY   -> refresh only, belt and braces
#   11:32 UTC = 18:32 WIB  IDX end-of-day  -> official OHLC + foreign flow
#   Sat 01:00 UTC = 08:00 WIB              -> fundamentals, ratios, brokers
#
# THE CLOSING CAPTURE IS THE ONE THAT MATTERS and it is scheduled twice on
# purpose. IDX's regular session 2 ends 15:49:59 WIB, pre-closing runs to 16:00
# and the closing price is fixed by ~16:04. A run at 16:17 is safely after that.
# GitHub's scheduler drops runs outright under load — the repository's own
# history shows the 05:05 and 09:20 slots producing no commits for days while
# 11:30 committed reliably — so a second attempt 30 minutes later is what makes
# "the close is always committed" actually true rather than merely intended.
# Round minutes (:00, :05, :20, :30) are the most contended; odd ones are not.
#
# STEP ORDER IS DELIBERATE. Price data is committed and the alert is sent BEFORE
# the slow optional work runs. A cancelled job does not run its remaining steps,
# so putting the fundamentals crawl first would mean a timeout there throws away
# a perfectly good price refresh — which is exactly what happened on run #1.
#
# GitHub's scheduler is best-effort and can run several minutes late under load.

on:
  schedule:
    - cron: '7 5 * * 1-5'
    - cron: '17 9 * * 1-5'
    - cron: '47 9 * * 1-5'
    - cron: '32 11 * * 1-5'
    - cron: '0 1 * * 6'
  # A MANUAL RUN MEANS "MAKE THE DATA CURRENT", and it did not.
  #
  # With no cron to match, the plan step left EOD=false, so pressing Run
  # workflow refreshed Yahoo quotes and nothing else: the official IDX series,
  # foreign flow and the disclosure archive stayed exactly as stale as before
  # while the run went green and committed a file. That is the failure mode this
  # repository keeps meeting — a step that succeeds at less than you asked for.
  # The official catch-up plus announcements take about 25 seconds together, so
  # a manual run now does them by default; `full_refresh` still guards the slow
  # weekly crawls.
  workflow_dispatch:
    inputs:
      send_alert:
        description: 'Kirim email digest setelah refresh'
        type: boolean
        default: false
      official_catchup:
        description: 'Tarik juga data resmi IDX + pengumuman (cepat, ~25 detik)'
        type: boolean
        default: true
      full_refresh:
        description: 'Tarik ulang fundamental, rasio valuasi, dan broker (lambat, ~30 menit)'
        type: boolean
        default: false

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Generous, because the weekly fundamentals crawl makes ~1000 Yahoo requests
    # and a datacenter IP gets rate limited harder than a home connection does.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Tentukan pekerjaan dari jadwal
        id: plan
        run: |
          CRON="${{ github.event.schedule }}"
          ALERT=false; EOD=false; WEEKLY=false; CLOSE=false; TRIGGER="Manual"
          case "$CRON" in
            "7 5 * * 1-5")   ALERT=true;  TRIGGER="Sesi I selesai" ;;
            "17 9 * * 1-5")  ALERT=true;  CLOSE=true; TRIGGER="Pasar tutup" ;;
            "47 9 * * 1-5")  CLOSE=true;  TRIGGER="Penutupan (percobaan kedua)" ;;
            "32 11 * * 1-5") EOD=true ;;
            "0 1 * * 6")     WEEKLY=true; EOD=true ;;
          esac
          if [ "${{ inputs.send_alert }}" = "true" ]; then ALERT=true; fi
          if [ "${{ inputs.official_catchup }}" = "true" ]; then EOD=true; fi
          if [ "${{ inputs.full_refresh }}" = "true" ]; then WEEKLY=true; EOD=true; fi
          {
            echo "alert=$ALERT"
            echo "eod=$EOD"
            echo "weekly=$WEEKLY"
            echo "close=$CLOSE"
            echo "trigger=$TRIGGER"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- prices

      # Yahoo quotes every listed emiten plus IHSG and LQ45. This is the tier
      # that must succeed for the deployed app to look current.
      - name: Harga live
        run: npm run data:intraday

      # On a closing run, say out loud in the log which session phase the quotes
      # were taken in. A capture that ran while the market was still open is a
      # silent failure otherwise — the file looks fine, it is simply not the
      # close, and nobody finds out until the chart disagrees with the broker.
      - name: Pastikan kuotasi benar-benar penutupan
        if: steps.plan.outputs.close == 'true'
        run: |
          node -e "
            const j = require('./public/data/idx/intraday.json');
            const closed = j.sessionPhase === 'closed' || j.marketState === 'POSTPOST' || j.marketState === 'CLOSED';
            console.log('tradingDate', j.tradingDate, '| marketState', j.marketState, '| phase', j.sessionPhase);
            if (!closed) {
              console.log('::warning::Kuotasi diambil sebelum pasar benar-benar tutup (' + j.sessionPhase + '). Cron kedua pukul 16:47 WIB akan mencoba lagi.');
            } else {
              console.log('Penutupan sesi 2 tertangkap.');
            }
          "

      # A short catch-up MERGES into the committed history; it does not rebuild
      # it. Rebuilding from a 25-day window would silently shorten the series
      # from a year to a fortnight and break every momentum factor.
      #
      # Run #1 proved IDX does NOT block GitHub's datacenter IPs — the full
      # 430-day crawl completed from a runner. `continue-on-error` stays as a
      # safety net in case that changes.
      - name: Data resmi IDX (catch-up harian)
        if: steps.plan.outputs.eod == 'true' && steps.plan.outputs.weekly != 'true'
        continue-on-error: true
        run: node scripts/ingest-idx.mjs --days 25

      - name: Data resmi IDX (crawl penuh mingguan)
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        run: npm run data:refresh

      # Keterbukaan informasi drives the watchlist's narrative stage. It is five
      # pages of JSON and finishes in seconds, so it rides the daily end-of-day
      # tier rather than the weekly one — a filing from Tuesday is exactly what
      # the weekly watchlist is supposed to react to.
      - name: Pengumuman keterbukaan informasi IDX
        if: steps.plan.outputs.eod == 'true' || steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        run: npm run data:announcements

      # Committed BEFORE the test suite, not after.
      #
      # `npm test` reconciles index attribution against whatever prices just
      # landed. It is a guard on the MODELS, not on the data pull — but a step
      # that exits non-zero stops the job, and with the commit behind it a single
      # failing reconciliation threw away a perfectly good closing price and left
      # the deployed terminal showing the morning's numbers until the next cron.
      # Prices commit first; the test still runs, and still turns the run red.
      - name: Commit data harga
        run: |
          git config user.name  "valuationpro-bot"
          git config user.email "actions@github.com"
          git add public/data/idx
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data harga."
          else
            LABEL="harga IDX"
            if [ "${{ steps.plan.outputs.close }}" = "true" ]; then LABEL="penutupan IDX"; fi
            git commit -m "data: $LABEL $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Uji mesin valuasi terhadap data harga baru
        run: npm test

      # The alert is the point of the whole schedule, so it goes out before the
      # optional crawls that might time out.
      - name: Kirim digest stock pick
        if: steps.plan.outputs.alert == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          npx esbuild src/server/alertCli.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --packages=external --outfile=.cache/alert.mjs --log-level=warning
          node .cache/alert.mjs --trigger "${{ steps.plan.outputs.trigger }}"

      # ------------------------------------------------------- slow, weekly only

      - name: Rasio valuasi & mata uang pelaporan
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        run: npm run data:quotes

      - name: Laporan keuangan tahunan
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        run: node scripts/ingest-fundamentals.mjs --concurrency 2 --gap 200

      - name: Aktivitas anggota bursa
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        run: npm run data:brokers

      # KSEI publishes ownership once a month, so a weekly check is more than
      # enough. The runner has no warm cache, so this re-downloads all 24 months
      # every time — ~3 MB and well under a minute. Rebuilding in full is also
      # what makes it safe: unlike the price ingest there is no partial-window
      # mode that could silently truncate the series.
      - name: Register kepemilikan KSEI
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        run: npm run data:ownership

      - name: Commit data fundamental
        if: steps.plan.outputs.weekly == 'true'
        run: |
          git add public/data/idx
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan fundamental."
          else
            git commit -m "data: fundamental, broker & kepemilikan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi
